<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チームメンバー</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">
  <div class="py-12 text-center">
    <h1 class="text-4xl font-bold text-gray-800">
      Team Members
    </h1>
    <p class="mt-3 text-gray-500">
      メンバー紹介
    </p>
  </div>

  <div class="max-w-6xl mx-auto px-6 pb-12">
    <div
      id="member-list"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    </div>
  </div>

  <script>
    const members = [
      {
        name: "田中 恒一",
        role: "プロジェクトリーダー",
        comment: "チーム全体をまとめ、プロジェクトを成功に導きます。"
      },
      {
        name: "佐藤 美咲",
        role: "デザイナー",
        comment: "使いやすく、楽しいユーザー体験をデザインします。"
      },
      {
        name: "鈴木 健太",
        role: "エンジニア",
        comment: "ユーザーが直接触れる部分の開発を担当しています。"
      },
      {
        name: "高橋 陽子",
        role: "エンジニア",
        comment: "安定して動作するシステムの設計と開発を担当します。"
      },
      {
        name: "伊藤 翔",
        role: "マーケティング",
        comment: "サービスの魅力を多くの人に届ける仕事をしています。"
      }
    ];
    const memberList = document.getElementById("member-list");
    members.forEach((member) => {
      const card = document.createElement("article");
      card.className =
        "bg-white rounded-xl shadow-md p-6 hover:shadow-lg transition-shadow";
      card.innerHTML = `
        <h2 class="text-xl font-bold text-gray-800">
          ${member.name}
        </h2>
        <p class="mt-2 text-sm font-semibold text-blue-600">
          ${member.role}
        </p>
        <p class="mt-4 text-gray-600 leading-relaxed">
          ${member.comment}
        </p>
      `;
      memberList.appendChild(card);
    });
  </script>
</body>
</html>
