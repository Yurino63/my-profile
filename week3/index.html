<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歴代総理大臣 自己紹介カード</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 px-4 py-10">

  <div class="mx-auto max-w-6xl">
    <div class="mb-10 text-center">
      <h1 class="text-3xl font-bold text-slate-800">
        歴代総理大臣
      </h1>
      <p class="mt-2 text-slate-500">
        日本の歴史を代表する3人の総理大臣
      </p>
    </div>
    <div class="flex flex-col gap-6 md:flex-row md:items-stretch">
      <div class="flex flex-1 flex-col items-center rounded-xl bg-white p-8 text-center shadow-md transition hover:-translate-y-1 hover:shadow-xl">
        <span class="mb-5 text-6xl">🎩</span>
        <h2 class="text-2xl font-bold text-slate-800">
          伊藤博文
        </h2>
        <p class="mt-4 leading-7 text-slate-600">
          日本の初代内閣総理大臣を務めた政治家です。
          明治政府の中心人物として近代日本の制度づくりに関わりました。
        </p>
      </div>
      <div class="flex flex-1 flex-col items-center rounded-xl bg-white p-8 text-center shadow-md transition hover:-translate-y-1 hover:shadow-xl">
        <span class="mb-5 text-6xl">🕴️</span>
        <h2 class="text-2xl font-bold text-slate-800">
          吉田茂
        </h2>
        <p class="mt-4 leading-7 text-slate-600">
          戦後の日本を代表する政治家の一人で、複数回にわたり総理大臣を務めました。戦後復興と日本の国際社会への復帰に取り組みました。
        </p>
      </div>
      <div class="flex flex-1 flex-col items-center rounded-xl bg-white p-8 text-center shadow-md transition hover:-translate-y-1 hover:shadow-xl">
        <span class="mb-5 text-6xl">👔</span>
        <h2 class="text-2xl font-bold text-slate-800">
          小泉純一郎
        </h2>
        <p class="mt-4 leading-7 text-slate-600">
          2001年から2006年まで内閣総理大臣を務めました。構造改革などを掲げ、長期政権を率いた政治家です。
        </p>
      </div>
    </div>
  </div>
</body>
</html>
