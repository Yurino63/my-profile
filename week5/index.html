<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>そらいろNPO</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-sky-50">
  <div class="bg-sky-600 p-4 text-white">
    <div class="mx-auto flex max-w-5xl flex-col items-center gap-4 md:flex-row md:justify-between">
      <h1 class="text-xl font-bold">そらいろNPO</h1>
      <div class="flex flex-col gap-2 text-center md:flex-row md:gap-6">
        <a href="#">活動紹介</a>
        <a href="#">参加する</a>
        <a href="#">お問い合わせ</a>
      </div>
    </div>
  </div>

  <div class="mx-auto max-w-5xl px-4 py-10">

    <div class="mb-10 text-center">
      <h2 class="text-3xl font-bold text-sky-900">
        子どもたちの未来を応援します
      </h2>
      <p class="mt-4 text-gray-600">
        地域の子どもたちの学びと交流を支援しています。
      </p>
    </div>
    <div class="grid grid-cols-1 gap-6 md:grid-cols-3">
      <div class="rounded-lg bg-white p-6 shadow">
        <span class="text-4xl">📚</span>
        <h3 class="mt-4 text-xl font-bold">学習支援</h3>
        <p class="mt-2 text-gray-600">
          子どもたちの勉強をサポートします。
        </p>
      </div>
      <div class="rounded-lg bg-white p-6 shadow">
        <span class="text-4xl">🍚</span>
        <h3 class="mt-4 text-xl font-bold">子ども食堂</h3>
        <p class="mt-2 text-gray-600">
          みんなで楽しく食事できる場所を作ります。
        </p>
      </div>
      <div class="rounded-lg bg-white p-6 shadow">
        <span class="text-4xl">🎨</span>
        <h3 class="mt-4 text-xl font-bold">体験活動</h3>
        <p class="mt-2 text-gray-600">
          工作やイベントなどの体験を提供します。
        </p>
      </div>
    </div>
  </div>
  <footer class="mt-10 bg-sky-800 p-6 text-center text-white">
    © 2026 そらいろNPO
  </footer>
</body>
</html>
